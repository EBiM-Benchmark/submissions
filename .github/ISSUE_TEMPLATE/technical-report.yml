name: Technical Report Submission
description: Submit a Technical Report — for teams with technical progress but no deployable policy yet.
title: "[Report] <your team name> — <task>"
labels: ["technical-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form if your team has made real technical progress but is **not yet ready to submit a
        deployable policy**. If you have a public repository with a Dockerfile and a run README, go back to
        [New issue](https://github.com/EBiM-Benchmark/submissions/issues/new/choose) and use the
        **Repository Submission** form instead — a working policy scores higher than a report about one.

        This is **not a paper-writing competition**. The question we are answering is: *how close is your
        solution to running on the real robot?* Assessment weights are: method and system completeness 25%,
        simulation and task completion 30%, policy and code readiness 25%, real-world deployment readiness 20%.

        **Claims about task completion must be evidenced** — a repository, logs, or a short video. A report
        asserting results with nothing to show cannot score the 30% component.

        One issue per team, per task. If you are competing in two tasks, that is two issues, not one.
        Submitting again is allowed until **Aug 22, 2026 (AoE)** — open a new issue and note that it
        supersedes your earlier one.

        If you have agreed a different team name or point-of-contact address with us since you registered,
        file under the one we agreed and put your original registered name in the Notes field.

        The tasks are defined in the [Autonomous Robot Benchmark Rulebook 1.0](https://ebim-benchmark.github.io/docs/Autonomous_Robot_Benchmark_Rulebook_1.0.pdf).
        The Rulebook labels the tasks **Track 1 / 2 / 3**: Track 1 is Task 1, Track 2 is Task 2, Track 3 is
        Task 3. For Task 1, plugging is not evaluated — scoring covers cable routing only.

        **Weighting is separate and is not in the Rulebook.** Your rubric score is multiplied by a weight
        reflecting when you submitted. Technical Reports are weighted at 0.65 of a policy submission's
        scale — see the announcement email.

  # --- SHARED FIELDS: identical in id, label, description and order to submission.yml.
  # --- Change one, change both, in the same commit.
  - type: input
    id: team_name
    attributes:
      label: Team name
      description: Must match your registration, unless you have agreed a different name with us.
    validations:
      required: true
  - type: input
    id: poc_email
    attributes:
      label: Point-of-contact email
      description: Must match the Member 1 (Point of Contact) email from your registration, unless you have agreed a different address with us — we verify against the registration records.
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Task
      description: Which task is this submission for? File a separate issue for each task you compete in.
      options:
        - "Task 1 — Cable Routing & Plugging"
        - "Task 2 — Deformable Material Handling (Thermal Pad Placement)"
        - "Task 3 — Assisted Living & Feeding"
    validations:
      required: true
  # --- END SHARED FIELDS

  - type: input
    id: report_url
    attributes:
      label: Link to your Technical Report
      description: A PDF or document we can open. Google Docs, arXiv, or a file in a repository all work. If your report is not hosted anywhere yet, put a placeholder here and attach it in a comment as soon as you have filed.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: evidence_url
    attributes:
      label: Evidence of your simulation results
      description: A repository, run logs, or a short video. This is what the simulation and task completion component (30%) is assessed on — a report without it cannot score that section.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: current_state
    attributes:
      label: What runs today, and what does not?
      description: Two or three sentences. Be specific about the gap between your current system and a deployable policy — this is the question the assessment is built around, and an honest answer scores better than an optimistic one.
    validations:
      required: true
  - type: input
    id: supplementary
    attributes:
      label: Optional supplementary links
      description: e.g. Hugging Face model weights or datasets. Links may point to private or access-controlled resources — a link here is not a publication. If your materials cannot be public, email organizers@ebim-benchmark.org before the deadline to arrange access instead of filling this field.
      placeholder: https://huggingface.co/...
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I understand a Technical Report is assessed on technical maturity and readiness for real-world deployment, and is weighted at 0.65 of a policy submission's scale.
          required: true
