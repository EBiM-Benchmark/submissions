name: Repository Submission
description: Submit your team's work for the EBiM Competition.
title: "[Submission] <your team name> — <task>"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Submit your team's work by filling out this form. Two things are called a submission here: the
        **issue** you file with this form, and the **public repository** it links to. The form files the
        issue; the repository holds the work.

        Your repository must be **public** and contain a **Dockerfile** encapsulating your work and a
        **README** explaining how to run it. Source code is **not** required. You may optionally link
        supplementary materials (e.g. Hugging Face model weights or datasets) — if you do, include a clear
        integration guide in your README.

        One issue per team, per task. If you are competing in two tasks, that is two issues, not one.
        Submitting again (e.g. an updated repository) is allowed until Aug 22, 2026 (AoE) — open a new issue and
        note that it supersedes your earlier one.

        If you have agreed a different team name or point-of-contact address with us since you registered,
        file under the one we agreed and put your original registered name in the Notes field.

        Not ready to submit a deployable policy? Use the **Technical Report** form instead — go back to
        [New issue](https://github.com/EBiM-Benchmark/submissions/issues/new/choose) and choose it. A report
        that documents working software scores better than a policy that does not run.

        The task metrics — what is measured, and how a run is scored — are defined in the
        [Autonomous Robot Benchmark Rulebook 1.0](https://ebim-benchmark.github.io/docs/Autonomous_Robot_Benchmark_Rulebook_1.0.pdf).
        The Rulebook labels the tasks **Track 1 / 2 / 3**: Track 1 is Task 1, Track 2 is Task 2, Track 3 is Task 3.
        For Task 1, plugging is not evaluated — scoring covers cable routing only.

        **Weighting is separate and is not in the Rulebook.** Your rubric score is multiplied by a weight
        reflecting when you submitted and whether you used the simulator's ground-truth poses. See the
        announcement email for the weights.
  - type: input
    id: team_name
    attributes:
      label: Team name
      description: Must match your registration, unless you have agreed a different name with us.
    validations:
      required: true
  - type: input
    id: poc_email
    attributes:
      label: Point-of-contact email
      description: Must match the Member 1 (Point of Contact) email from your registration, unless you have agreed a different address with us — we verify against the registration records.
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Task
      description: Which task is this submission for? File a separate issue for each task you compete in.
      options:
        - "Task 1 — Cable Routing & Plugging"
        - "Task 2 — Deformable Material Handling (Thermal Pad Placement)"
        - "Task 3 — Assisted Living & Feeding"
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Public GitHub repository URL
      placeholder: https://github.com/your-team/your-repo
    validations:
      required: true
  - type: dropdown
    id: ground_truth
    attributes:
      label: Did this submission use the simulator's ground-truth object poses?
      description: >
        For Phase I you may use ground-truth object positions and states provided directly by the
        simulator. Both answers are valid submissions. Solving perception yourself carries a slightly
        higher scoring weight because it is closer to what Phase II requires. We take this answer in
        good faith; a declaration that does not match the submitted code may lead to disqualification.
      options:
        - "No — our solution does its own perception"
        - "Yes — we use the simulator's ground-truth object poses"
        - "Partly — see Notes"
    validations:
      required: true
  - type: checkboxes
    id: requirements
    attributes:
      label: Submission requirements
      options:
        - label: The repository is public.
          required: true
        - label: It contains a Dockerfile encapsulating our work.
          required: true
        - label: It contains a README explaining how to run it.
          required: true
  - type: input
    id: supplementary
    attributes:
      label: Optional supplementary links
      description: e.g. Hugging Face model weights or datasets. Links may point to private or access-controlled resources — a link here is not a publication. If your materials cannot be public, email organizers@ebim-benchmark.org before the deadline to arrange access instead of filling this field. If provided, your README must include a clear integration guide.
      placeholder: https://huggingface.co/...
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I understand source code is not required, but a Dockerfile and a run README are.
          required: true
